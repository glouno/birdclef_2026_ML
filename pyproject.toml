[project]
name = "birdclef-2026-ml"
version = "0.1.0"
description = "BirdCLEF 2026 - ML Challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "fastparquet>=2026.3.0",
    "geodatasets>=2026.1.0",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "lightgbm>=4.6.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "xgboost>=3.2.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
birdclef = "birdclef_2026_ml.cli:main"

